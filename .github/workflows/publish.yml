name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # Trusted Publishing 必需：允许获取 OIDC 令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release -o ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

      # 通过 OIDC 与 nuget.org 交换短期 API key（Trusted Publishing）
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.nuget_api_key }} --skip-duplicate
